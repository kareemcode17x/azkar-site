<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سورة الكهف | الأذكار</title>
<meta name="description" content="سورة الكهف مكتوبة مع التلاوة الصوتية، وفضل قراءتها يوم الجمعة.">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script>(function(){var s=null;try{s=localStorage.getItem('theme')}catch(e){}var d=s?s==='dark':matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',d?'dark':'light')})();</script>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="kahf">
<header class="bar"><div class="bar-in">
  <a class="back" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>الرئيسية</a>
  <h1>سورة الكهف</h1>
  <button class="icon-btn" id="theme-toggle" type="button" aria-label="تبديل الوضع الليلي"></button>
</div></header>
<main class="wrap">
  <section class="hadith" aria-label="فضل قراءة السورة">
    <p class="hadith-explain">عن أبي سعيد الخدري رضي الله عنه، قال رسول الله ﷺ:</p>
    <p class="hadith-text">«مَنْ قَرَأَ سُورَةَ الْكَهْفِ فِي يَوْمِ الْجُمُعَةِ، أَضَاءَ لَهُ مِنَ النُّورِ مَا بَيْنَ الْجُمُعَتَيْنِ»</p>
    <span class="hadith-source">رواه الحاكم والبيهقي وصححه الألباني</span>
  </section>
  <div class="mushaf">
    <div class="loader" id="loader" role="status" aria-label="جاري التحميل"></div>
    <div class="quran" id="quran-container"><span class="basmala">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</span></div>
  </div>
  <div class="player">
    <button id="play-audio-btn" type="button" aria-pressed="false"></button>
  </div>
  <audio id="quran-audio" src="https://server8.mp3quran.net/afs/018.mp3" preload="none"></audio>
</main>
<footer class="footer"><a href="https://t.me/touba_w_azkar" target="_blank" rel="noopener noreferrer">قناة التليجرام</a></footer>
<script src="app.js"></script>
<script>
(function () {
  var nf = new Intl.NumberFormat('ar-EG');
  var CACHE = 'kahf:ayahs:v1';
  var box = document.getElementById('quran-container');
  var loader = document.getElementById('loader');

  function render(ayahs) {
    var frag = document.createDocumentFragment();
    ayahs.forEach(function (a) {
      var t = a[0];
      // بعض الإصدارات تضيف البسملة لأول آية، وهي معروضة أعلاه
      if (a[1] === 1 && /^بِسْمِ/.test(t)) t = t.split(' ').slice(4).join(' ');
      frag.appendChild(document.createTextNode(t + ' '));
      var n = document.createElement('span');
      n.className = 'ayah-no';
      n.textContent = '\uFD3F' + nf.format(a[1]) + '\uFD3E';
      frag.appendChild(n);
      frag.appendChild(document.createTextNode(' '));
    });
    box.appendChild(frag);
  }

  function fail() {
    var e = document.createElement('div');
    e.className = 'error';
    e.innerHTML = '<p>تعذّر تحميل السورة. تأكد من اتصالك بالإنترنت ثم حاول مرة أخرى.</p><button class="tap" type="button">إعادة المحاولة</button>';
    e.querySelector('button').addEventListener('click', function () { e.remove(); loader.style.display = 'block'; load(); });
    box.appendChild(e);
  }

  async function load() {
    var ayahs = null;
    try { ayahs = JSON.parse(localStorage.getItem(CACHE)); } catch (e) {}
    if (!ayahs) {
      try {
        var r = await fetch('https://api.alquran.cloud/v1/surah/18/quran-uthmani');
        if (!r.ok) throw new Error(r.status);
        var j = await r.json();
        ayahs = j.data.ayahs.map(function (a) { return [a.text, a.numberInSurah]; });
        try { localStorage.setItem(CACHE, JSON.stringify(ayahs)); } catch (e) {}
      } catch (e) { loader.style.display = 'none'; fail(); return; }
    }
    loader.style.display = 'none';
    render(ayahs);
  }

  var audio = document.getElementById('quran-audio');
  var btn = document.getElementById('play-audio-btn');
  var PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>';
  var PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
  function label() {
    btn.innerHTML = (audio.paused ? PLAY : PAUSE) + '<span>' + (audio.paused ? 'استمع للسورة بصوت مشاري العفاسي' : 'إيقاف مؤقت') + '</span>';
    btn.setAttribute('aria-pressed', String(!audio.paused));
  }
  btn.addEventListener('click', function () {
    if (audio.paused) { audio.play().catch(function () {}); } else { audio.pause(); }
  });
  ['play', 'pause', 'ended'].forEach(function (ev) { audio.addEventListener(ev, label); });
  label();
  load();
})();
</script>
</body>
</html>
