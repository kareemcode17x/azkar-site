<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأذكار</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #1a5c4a, #2d8b6f); padding: 20px; transition: background 0.3s; padding-bottom: 100px;
        }
        body.dark-mode { background: #000000; }
        
        h1 { color: #fff; font-size: 2.5rem; margin-bottom: 30px; text-align: center; }
        
        .theme-toggle {
            position: fixed; top: 20px; left: 20px; background: rgba(255,255,255,0.1);
            border: 1px solid #333; color: white; font-size: 1.5rem; padding: 10px 15px; border-radius: 50%;
            cursor: pointer; transition: 0.2s; z-index: 100;
        }
        .theme-toggle:hover { background: rgba(255,255,255,0.2); }

        .buttons { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 350px; margin-bottom: 30px; }
        .btn {
            display: block; text-align: center; padding: 25px; border-radius: 15px; text-decoration: none;
            color: #fff; font-size: 1.5rem; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: 0.2s;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .btn-morning { background: linear-gradient(135deg, #f0a500, #ffc93c); color: #3a2a00; }
        .btn-evening { background: linear-gradient(135deg, #2c3e80, #4a5fc1); }
    </style>
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙</button>
    <h1>🌿 الأذكار 🌿</h1>
    
    <div class="buttons">
        <a href="morning.html" class="btn btn-morning">🌅 أذكار الصباح</a>
        <a href="evening.html" class="btn btn-evening">🌙 أذكار المساء</a>
        <a href="kahf.html" class="btn" style="background: linear-gradient(135deg, #33691e, #558b2f); color: white;">📖 سورة الكهف</a>
    </div>

    <!-- صندوق حديث اليوم -->
    <div id="hadith-box" style="background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); border-radius: 15px; padding: 20px; margin-bottom: 80px; max-width: 350px; width: 100%; color: #fff; text-align: center;">
        <h3 style="margin-bottom: 10px; font-size: 1.1rem; color: #ffc93c;">📜 حديث اليوم</h3>
        <p id="hadith-text" style="font-size: 1.1rem; line-height: 1.8; margin-bottom: 10px; font-weight: bold;"></p>
        <p id="hadith-explanation" style="font-size: 0.9rem; line-height: 1.6; color: #ddd; margin-bottom: 10px;"></p>
        <span id="hadith-grade" style="display: inline-block; background: #2e7d32; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem;"></span>
    </div>

    <!-- زرار التليجرام في الصفحة الرئيسية -->
    <div style="position: fixed; bottom: 20px; width: 100%; text-align: center; z-index: 100;">
        <a href="https://t.me/K_Zsc1" target="_blank" style="display: inline-flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.1); color: #fff; padding: 10px 20px; border-radius: 50px; text-decoration: none; font-weight: bold; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px); transition: 0.2s;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z" fill="currentColor"/></svg>
            <span style="font-family: sans-serif; font-size: 0.9rem;">Developed by KEMO</span>
        </a>
    </div>

    <script>
        // مجموعة أكبر من الأحاديث الصحيحة
        const ahadith = [
            { text: "«إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى»", explanation: "الشرح: أصل عظيم في الإسلام، الأعمال لا تُقبل إلا إذا كانت خالصة لله.", grade: "صحيح البخاري" },
            { text: "«الْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ»", explanation: "الشرح: المسلم الحق هو الذي يكف أذاه عن غيره بلسانه ويده.", grade: "صحيح البخاري" },
            { text: "«لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ»", explanation: "الشرح: من كمال الإيمان أن يحب المسلم لأخيه ما يحبه لنفسه.", grade: "صحيح البخاري ومسلم" },
            { text: "«مَنْ صَلَّى عَلَيَّ صَلَاةً صَلَّى اللَّهُ عَلَيْهِ بِهَا عَشْرًا»", explanation: "الشرح: من صلى على النبي ﷺ مرة، أثابه الله عشر حسنات.", grade: "صحيح مسلم" },
            { text: "«الطُّهُورُ شَطْرُ الإِيمَانِ»", explanation: "الشرح: النظافة والتطهر نصف الإيمان، لأن الطهارة شرط للصلاة.", grade: "صحيح مسلم" },
            { text: "«مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ»", explanation: "الشرح: حفظ اللسان من الإيمان، فإما كلام خير أو صمت.", grade: "صحيح البخاري ومسلم" },
            { text: "«مَنْ حَجَّ فَلَمْ يَرْفُثْ وَلَمْ يَفْسُقْ رَجَعَ كَيَوْمِ وَلَدَتْهُ أُمُّهُ»", explanation: "الشرح: الحج المبرور يمحو الذنوب ويرجع الإنسان كيوم ولدته أمه.", grade: "صحيح البخاري" },
            { text: "«الدِّينُ النَّصِيحَةُ»", explanation: "الشرح: الدين قائم على النصيحة لله ولكتابه ولرسوله ولأئمة المسلمين وعامتهم.", grade: "صحيح مسلم" },
            { text: "«مَنْ غَشَّنَا فَلَيْسَ مِنَّا»", explanation: "الشرح: الغش محرم، ومن غش المسلمين فليس على منهج النبي ﷺ.", grade: "صحيح مسلم" },
            { text: "«الْحَلَالُ بَيِّنٌ وَالْحَرَامُ بَيِّنٌ»", explanation: "الشرح: الأمور واضحة، وبينهما مشتبهات يجب تركها.", grade: "صحيح البخاري ومسلم" },
            { text: "«اتَّقِ اللَّهَ حَيْثُمَا كُنْتَ»", explanation: "الشرح: راقب الله في السر والعلن، وأتبع السيئة الحسنة تمحها.", grade: "سنن الترمذي (حسن)" },
            { text: "«مَنْ نَفَّسَ عَنْ مُؤْمِنٍ كُرْبَةً مِنْ كُرَبِ الدُّنْيَا نَفَّسَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ الْقِيَامَةِ»", explanation: "الشرح: الجزاء من جنس العمل، من فرج عن مسلم فرج الله عنه.", grade: "صحيح مسلم" },
            { text: "«مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ»", explanation: "الشرح: طلب العلم الشرعي طريق موصل إلى الجنة.", grade: "صحيح مسلم" },
            { text: "«لَا تَغْضَبْ»", explanation: "الشرح: وصية جامعة، والغضب مفتاح الشرور.", grade: "صحيح البخاري" },
            { text: "«مَنْ أَحَبَّ أَنْ يُبْسَطَ لَهُ فِي رِزْقِهِ وَيُنْسَأَ لَهُ فِي أَثَرِهِ فَلْيَصِلْ رَحِمَهُ»", explanation: "الشرح: صلة الرحم تزيد الرزق وتطيل العمر.", grade: "صحيح البخاري" },
            { text: "«مَا نَقَصَتْ صَدَقَةٌ مِنْ مَالٍ»", explanation: "الشرح: الصدقة لا تنقص المال بل تباركه.", grade: "صحيح مسلم" },
            { text: "«الْكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ»", explanation: "الشرح: الكلام الطيب صدقة يؤجر عليه المسلم.", grade: "صحيح البخاري" },
            { text: "«إِنَّ الرِّفْقَ لَا يَكُونُ فِي شَيْءٍ إِلَّا زَانَهُ»", explanation: "الشرح: الرفق يجمل الأشياء، والعنف يشينها.", grade: "صحيح مسلم" },
            { text: "«مَنْ لَا يَرْحَمُ النَّاسَ لَا يَرْحَمُهُ اللَّهُ»", explanation: "الشرح: من لا يرحم الخلق لا ينال رحمة الله.", grade: "صحيح البخاري" },
            { text: "«إِنَّ اللَّهَ جَمِيلٌ يُحِبُّ الْجَمَالَ»", explanation: "الشرح: الله جميل يحب الجمال في الأخلاق والخلق.", grade: "صحيح مسلم" },
            { text: "«السَّاعِي عَلَى الأَرْمَلَةِ وَالْمِسْكِينِ كَالْمُجَاهِدِ فِي سَبِيلِ اللَّهِ»", explanation: "الشرح: من يساعد الفقراء والمساكين له أجر عظيم.", grade: "صحيح البخاري" },
            { text: "«خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ»", explanation: "الشرح: أهل القرآن هم خير الناس، خاصة من علمه غيره.", grade: "صحيح البخاري" },
            { text: "«مَنْ أَشَرَ إِلَى أَخِيهِ بِحَدِيدَةٍ فَإِنَّ الْمَلَائِكَةَ تَلْعَنُهُ»", explanation: "الشرح: تحريم الترويع بالسلاح حتى على سبيل المزاح.", grade: "صحيح مسلم" },
            { text: "«إِنَّ اللَّهَ لَا يَنْظُرُ إِلَى صُوَرِكُمْ وَأَمْوَالِكُمْ وَلَكِنْ يَنْظُرُ إِلَى قُلُوبِكُمْ وَأَعْمَالِكُمْ»", explanation: "الشرح: الاعتبار عند الله بالقلوب الصالحة والأعمال، لا بالشكل والمال.", grade: "صحيح مسلم" },
            { text: "«بُنِيَ الإِسْلَامُ عَلَى خَمْسٍ»", explanation: "الشرح: الإسلام أساسه الشهادتان والصلاة والزكاة والصوم والحج.", grade: "صحيح البخاري ومسلم" },
            { text: "«مَنْ صَامَ رَمَضَانَ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ»", explanation: "الشرح: صيام رمضان بنية صادقة يغفر الذنوب السابقة.", grade: "صحيح البخاري ومسلم" },
            { text: "«لَيْسَ الْغِنَى عَنْ كَثْرَةِ الْعَرَضِ، وَلَكِنَّ الْغِنَى غِنَى النَّفْسِ»", explanation: "الشرح: الغنى الحقيقي هو غنى النفس والقناعة.", grade: "صحيح البخاري" },
            { text: "«مَنْ قَتَلَ نَفْسَهُ بِحَدِيدَةٍ فَحَدِيدَتُهُ فِي يَدِهِ يَتَوَجَّأُ بِهَا فِي بَطْنِهِ فِي نَارِ جَهَنَّمَ»", explanation: "الشرح: تحريم قتل النفس والوعيد الشديد لفاعله.", grade: "صحيح البخاري" },
            { text: "«مَثَلُ الْقَائِمِ عَلَى حُدُودِ اللَّهِ وَالْوَاقِعِ فِيهَا كَمَثَلِ قَوْمٍ اسْتَهَمُوا عَلَى سَفِينَةٍ»", explanation: "الشرح: من ترك المنكرات والمجاهرة بها نجا الجميع.", grade: "صحيح البخاري" },
            { text: "«مَنْ مَاتَ وَهُوَ يَدْعُو مِنْ دُونِ اللَّهِ نِدًّا دَخَلَ النَّارَ»", explanation: "الشرح: الشرك بالله أعظم الذنوب، ومن مات عليه دخل النار.", grade: "صحيح البخاري" },
            { text: "«مَا مِنْكُمْ مِنْ أَحَدٍ إِلَّا سَيُكَلِّمُهُ رَبُّهُ»", explanation: "الشرح: الله سيكلم كل عبد يوم القيامة بلا ترجمان.", grade: "صحيح البخاري" },
            { text: "«إِنَّ الْمَلَائِكَةَ لَتَضَعُ أَجْنِحَتَهَا لِطَالِبِ الْعِلْمِ»", explanation: "الشرح: الملائكة تحب طالب العلم وتضع له أجنحتها رضا بما يصنع.", grade: "سنن الترمذي (حسن صحيح)" },
            { text: "«مَنْ صَلَّى الْبَرْدَيْنِ دَخَلَ الْجَنَّةَ»", explanation: "الشرح: من حافظ على صلاة الفجر والعصر دخل الجنة.", grade: "صحيح البخاري ومسلم" }
        ];

        function loadHadithOfTheDay() {
            // بنجيب تاريخ اليوم (رقم اليوم في الشهر من 1 لـ 31)
            const today = new Date();
            const dayOfMonth = today.getDate(); 
            
            // بنختار الحديث بناءً على رقم اليوم (عشان يفضل ثابت طول اليوم)
            // لو رقم اليوم أكبر من عدد الأحاديث، هنقسم وناخد الباقي عشان نلف ونرجع للأول
            const index = (dayOfMonth - 1) % ahadith.length;
            const hadith = ahadith[index];
            
            document.getElementById('hadith-text').innerText = hadith.text;
            document.getElementById('hadith-explanation').innerText = hadith.explanation;
            document.getElementById('hadith-grade').innerText = hadith.grade;
        }

        window.onload = function() {
            loadHadithOfTheDay();
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('theme-toggle').innerText = '☀️';
            }
        };

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            let btn = document.getElementById('theme-toggle');
            if (document.body.classList.contains('dark-mode')) {
                btn.innerText = '☀️'; localStorage.setItem('theme', 'dark');
            } else {
                btn.innerText = '🌙'; localStorage.setItem('theme', 'light');
            }
        }
    </script>
</body>
</html>
