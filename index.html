<script>
// [النص، الشرح، المصدر]
const ahadith = [
  ["«إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى»", "أصل عظيم في الإسلام، الأعمال لا تُقبل إلا إذا كانت خالصة لله.", "صحيح البخاري"],
  ["«الْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ»", "المسلم الحق هو الذي يكف أذاه عن غيره بلسانه ويده.", "صحيح البخاري"],
  ["«لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ»", "من كمال الإيمان أن يحب المسلم لأخيه ما يحبه لنفسه.", "صحيح البخاري ومسلم"],
  ["«مَنْ صَلَّى عَلَيَّ صَلَاةً صَلَّى اللَّهُ عَلَيْهِ بِهَا عَشْرًا»", "من صلى على النبي ﷺ مرة، أثابه الله عشر حسنات.", "صحيح مسلم"],
  ["«الطُّهُورُ شَطْرُ الإِيمَانِ»", "النظافة والتطهر نصف الإيمان، لأن الطهارة شرط للصلاة.", "صحيح مسلم"],
  ["«مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ»", "حفظ اللسان من الإيمان، فإما كلام خير أو صمت.", "صحيح البخاري ومسلم"],
  ["«مَنْ حَجَّ فَلَمْ يَرْفُثْ وَلَمْ يَفْسُقْ رَجَعَ كَيَوْمِ وَلَدَتْهُ أُمُّهُ»", "الحج المبرور يمحو الذنوب ويرجع الإنسان كيوم ولدته أمه.", "صحيح البخاري"],
  ["«الدِّينُ النَّصِيحَةُ»", "الدين قائم على النصيحة لله ولكتابه ولرسوله ولأئمة المسلمين وعامتهم.", "صحيح مسلم"],
  ["«مَنْ غَشَّنَا فَلَيْسَ مِنَّا»", "الغش محرم، ومن غش المسلمين فليس على منهج النبي ﷺ.", "صحيح مسلم"],
  ["«الْحَلَالُ بَيِّنٌ وَالْحَرَامُ بَيِّنٌ»", "الأمور واضحة، وبينهما مشتبهات يجب تركها.", "صحيح البخاري ومسلم"],
  ["«اتَّقِ اللَّهَ حَيْثُمَا كُنْتَ»", "راقب الله في السر والعلن، وأتبع السيئة الحسنة تمحها.", "سنن الترمذي (حسن)"],
  ["«مَنْ نَفَّسَ عَنْ مُؤْمِنٍ كُرْبَةً مِنْ كُرَبِ الدُّنْيَا نَفَّسَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ الْقِيَامَةِ»", "الجزاء من جنس العمل، من فرج عن مسلم فرج الله عنه.", "صحيح مسلم"],
  ["«مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ»", "طلب العلم الشرعي طريق موصل إلى الجنة.", "صحيح مسلم"],
  ["«لَا تَغْضَبْ»", "وصية جامعة، والغضب مفتاح الشرور.", "صحيح البخاري"],
  ["«مَنْ أَحَبَّ أَنْ يُبْسَطَ لَهُ فِي رِزْقِهِ وَيُنْسَأَ لَهُ فِي أَثَرِهِ فَلْيَصِلْ رَحِمَهُ»", "صلة الرحم تزيد الرزق وتطيل العمر.", "صحيح البخاري"],
  ["«مَا نَقَصَتْ صَدَقَةٌ مِنْ مَالٍ»", "الصدقة لا تنقص المال بل تباركه.", "صحيح مسلم"],
  ["«الْكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ»", "الكلام الطيب صدقة يؤجر عليه المسلم.", "صحيح البخاري"],
  ["«إِنَّ الرِّفْقَ لَا يَكُونُ فِي شَيْءٍ إِلَّا زَانَهُ»", "الرفق يجمل الأشياء، والعنف يشينها.", "صحيح مسلم"],
  ["«مَنْ لَا يَرْحَمُ النَّاسَ لَا يَرْحَمُهُ اللَّهُ»", "من لا يرحم الخلق لا ينال رحمة الله.", "صحيح البخاري"],
  ["«إِنَّ اللَّهَ جَمِيلٌ يُحِبُّ الْجَمَالَ»", "الله جميل يحب الجمال في الأخلاق والخَلق.", "صحيح مسلم"],
  ["«السَّاعِي عَلَى الأَرْمَلَةِ وَالْمِسْكِينِ كَالْمُجَاهِدِ فِي سَبِيلِ اللَّهِ»", "من يساعد الفقراء والمساكين له أجر عظيم.", "صحيح البخاري"],
  ["«خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ»", "أهل القرآن هم خير الناس، خاصة من علمه غيره.", "صحيح البخاري"],
  ["«مَنْ أَشَارَ إِلَى أَخِيهِ بِحَدِيدَةٍ فَإِنَّ الْمَلَائِكَةَ تَلْعَنُهُ»", "تحريم الترويع بالسلاح حتى على سبيل المزاح.", "صحيح مسلم"],
  ["«إِنَّ اللَّهَ لَا يَنْظُرُ إِلَى صُوَرِكُمْ وَأَمْوَالِكُمْ وَلَكِنْ يَنْظُرُ إِلَى قُلُوبِكُمْ وَأَعْمَالِكُمْ»", "الاعتبار عند الله بالقلوب الصالحة والأعمال، لا بالشكل والمال.", "صحيح مسلم"],
  ["«بُنِيَ الإِسْلَامُ عَلَى خَمْسٍ»", "الإسلام أساسه الشهادتان والصلاة والزكاة والصوم والحج.", "صحيح البخاري ومسلم"],
  ["«مَنْ صَامَ رَمَضَانَ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ»", "صيام رمضان بنية صادقة يغفر الذنوب السابقة.", "صحيح البخاري ومسلم"],
  ["«لَيْسَ الْغِنَى عَنْ كَثْرَةِ الْعَرَضِ، وَلَكِنَّ الْغِنَى غِنَى النَّفْسِ»", "الغنى الحقيقي هو غنى النفس والقناعة.", "صحيح البخاري"],
  ["«مَنْ قَتَلَ نَفْسَهُ بِحَدِيدَةٍ فَحَدِيدَتُهُ فِي يَدِهِ يَتَوَجَّأُ بِهَا فِي بَطْنِهِ فِي نَارِ جَهَنَّمَ»", "تحريم قتل النفس والوعيد الشديد لفاعله.", "صحيح البخاري"],
  ["«مَثَلُ الْقَائِمِ عَلَى حُدُودِ اللَّهِ وَالْوَاقِعِ فِيهَا كَمَثَلِ قَوْمٍ اسْتَهَمُوا عَلَى سَفِينَةٍ»", "إذا ترك الناس المنكر ينجو الجميع، وإذا سكتوا عنه هلكوا جميعًا.", "صحيح البخاري"],
  ["«مَنْ مَاتَ وَهُوَ يَدْعُو مِنْ دُونِ اللَّهِ نِدًّا دَخَلَ النَّارَ»", "الشرك بالله أعظم الذنوب، ومن مات عليه دخل النار.", "صحيح البخاري"],
  ["«مَا مِنْكُمْ مِنْ أَحَدٍ إِلَّا سَيُكَلِّمُهُ رَبُّهُ»", "الله سيكلم كل عبد يوم القيامة بلا ترجمان.", "صحيح البخاري"],
  ["«إِنَّ الْمَلَائِكَةَ لَتَضَعُ أَجْنِحَتَهَا لِطَالِبِ الْعِلْمِ»", "الملائكة تحب طالب العلم وتضع له أجنحتها رضا بما يصنع.", "سنن الترمذي (حسن صحيح)"],
  ["«مَنْ صَلَّى الْبَرْدَيْنِ دَخَلَ الْجَنَّةَ»", "من حافظ على صلاة الفجر والعصر دخل الجنة.", "صحيح البخاري ومسلم"]
];

// يتغير الحديث كل يوم، ويدور على كل الأحاديث بحسب رقم اليوم في السنة
function dayOfYear(d) {
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function showHadith(now) {
  const h = ahadith[dayOfYear(now) % ahadith.length];
  document.getElementById('hadith-text').textContent = h[0];
  document.getElementById('hadith-explanation').textContent = h[1];
  document.getElementById('hadith-grade').textContent = h[2];
}

function showDate(now) {
  try {
    const hijri = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(now);
    document.getElementById('date').textContent = hijri;
  } catch (e) { /* المتصفح لا يدعم التقويم الهجري */ }
}

// يُبرز القسم الأنسب للوقت الحالي
function markNow(now) {
  const hour = now.getHours();
  const targets = [];
  if (hour < 12) targets.push(['row-morning', 'الآن']);
  else if (hour >= 15) targets.push(['row-evening', 'الآن']);
  if (now.getDay() === 5) targets.push(['row-quran', 'الكهف اليوم']);
  targets.forEach(function (t) {
    const title = document.querySelector('#' + t[0] + ' .row-title');
    const badge = document.createElement('span');
    badge.className = 'now';
    badge.textContent = t[1];
    title.appendChild(badge);
  });
}

function showStreaks() {
  const box = document.getElementById('streaks');
  [['morning', 'الصباح'], ['evening', 'المساء']].forEach(function (x) {
    const n = AzkarStreak.count(x[0]);
    if (n < 1) return;
    const s = document.createElement('span');
    s.className = 'chip';
    s.textContent = x[1] + ': ' + AzkarStreak.label(n);
    box.appendChild(s);
  });
  box.hidden = !box.children.length;
}

const now = new Date();
showStreaks();
showDate(now);
showHadith(now);
markNow(now);
</script>
