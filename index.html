<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأذكار</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #1a5c4a, #2d8b6f); padding: 20px; transition: background 0.3s;
        }
        
        /* الوضع الليلي: أسود صريح */
        body.dark-mode { 
            background: #000000; 
        }
        
        h1 { color: #fff; font-size: 2.5rem; margin-bottom: 40px; text-align: center; }
        
        .theme-toggle {
            position: fixed; top: 20px; left: 20px; background: rgba(255,255,255,0.1);
            border: 1px solid #333; color: white; font-size: 1.5rem; padding: 10px 15px; border-radius: 50%;
            cursor: pointer; transition: 0.2s; z-index: 100;
        }
        .theme-toggle:hover { background: rgba(255,255,255,0.2); }

        .buttons { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 350px; }
        .btn {
            display: block; text-align: center; padding: 25px; border-radius: 15px; text-decoration: none;
            color: #fff; font-size: 1.5rem; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: 0.2s;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .btn-morning { background: linear-gradient(135deg, #f0a500, #ffc93c); color: #3a2a00; }
        .btn-evening { background: linear-gradient(135deg, #2c3e80, #4a5fc1); }
    </style>
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙</button>
    <h1>🌿 الأذكار 🌿</h1>
    <div class="buttons">
        <a href="morning.html" class="btn btn-morning">🌅 أذكار الصباح</a>
        <a href="evening.html" class="btn btn-evening">🌙 أذكار المساء</a>
        <a href="kahf.html" class="btn" style="background: linear-gradient(135deg, #33691e, #558b2f); color: white;">📖 سورة الكهف</a>
    </div>
           <!-- زرار التليجرام في الصفحة الرئيسية -->
    <div style="position: fixed; bottom: 20px; width: 100%; text-align: center; z-index: 100;">
        <a href="https://t.me/K_Zsc1" target="_blank" style="display: inline-flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.1); color: #fff; padding: 10px 20px; border-radius: 50px; text-decoration: none; font-weight: bold; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px); transition: 0.2s;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z" fill="currentColor"/></svg>
            <span style="font-family: sans-serif; font-size: 0.9rem;">Developed by KEMO</span>
        </a>
    </div>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('theme-toggle').innerText = '☀️';
        }
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            let btn = document.getElementById('theme-toggle');
            if (document.body.classList.contains('dark-mode')) {
                btn.innerText = '☀️'; localStorage.setItem('theme', 'dark');
            } else {
                btn.innerText = '🌙'; localStorage.setItem('theme', 'light');
            }
        }
    </script>
</body>
</html>
